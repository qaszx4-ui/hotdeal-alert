name: hotdeal-alert

on:
  # 뽐뿌게시판만 여기서 확인 (뽐뿌가 Cloudflare 서버 접속을 막아서, 2026-11-05).
  # 뽐질 채널·텔레그램 명령은 Cloudflare Worker(cloudflare/worker.js)가 8분마다/즉시 처리.
  # GitHub 예약 실행은 실제로 몇 시간씩 늦게 돌 때가 많음 (2026-11 기록: 평균 153분 간격).
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: hotdeal-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check hotdeals
        run: python3 hotdeal_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
