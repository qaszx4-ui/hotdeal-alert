name: hotdeal-alert

on:
  # 예약 실행은 꺼 둠 (2026-11-05): 실제로 3~10시간 간격으로만 돌았고, GitHub 약관상 상시 봇 용도는 부적합.
  # 지금은 Cloudflare Worker(cloudflare/worker.js)가 2분마다 확인함.
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: hotdeal-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check hotdeals
        run: python3 hotdeal_alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
